<app-modal modalId="given-template-modal" blocking="true" closebtn="true">
    <form [formGroup]="givenTemplateForm" class="m-2">
        <div class="d-flex">
            <div *ngFor="let group of template.promptGroups; let igroup = index"
                class="p-2 flex-fill">
                <p class="font-weight-bold">{{ group.displayTitle == "" ? "&nbsp;": group.displayTitle }}</p>
                <div *ngFor="let prompt of group.prompts; let iPrompt = index">

                    <div *ngIf="prompt.isActive && prompt.type == 'CheckBox'"
                        [ngClass]="{'gt-all-above-first-child': inAllAbove(group, prompt) == 1,'gt-all-above-child': inAllAbove(group, prompt), 'gt-all-above':prompt.promptChoices.length}">
                        <input type="checkbox"
                            [formControlName]="prompt.id"
                            id="{{ prompt.id }}"
                            (click)="onClickCheckbox(prompt)">
                        {{ prompt.prompt }}
                    </div>

                    <div *ngIf="prompt.isActive && prompt.type == 'FreeText'">
                        {{ prompt.prompt }}
                        <input type="text" [formControlName]="prompt.id" id="{{ prompt.id }}">
                    </div>

                    <div *ngIf="prompt.isActive && prompt.type == 'MultiLineFreeText'">
                        {{ prompt.prompt }}
                        <textarea [formControlName]="prompt.id" id="{{ prompt.id }}"></textarea>
                    </div>

                    <div *ngIf="prompt.isActive && prompt.type == 'DropDownListBox'">
                        {{ prompt.prompt }}
                        <div ngbDropdown class="d-inline-block">
                            <button class="btn btn-outline-secondary" id="{{ prompt.id }}" ngbDropdownToggle>
                                {{ getChoice(prompt) !== "" ? getChoice(prompt): "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;" }}
                            </button>
                            <div ngbDropdownMenu attr.aria-labelledby="{{ prompt.id }}">
                                <button ngbDropdownItem *ngFor="let choice of prompt.promptChoices"
                                    (click)="onSelectChoice(prompt, choice)">
                                    {{ choice.choiceText }}
                                </button>
                                <button ngbDropdownItem (click)="onSelectChoice(prompt,null)">
                                    &nbsp;
                                </button>
                            </div>
                        </div>
                    </div>

                    <div *ngIf="prompt.isActive && prompt.type == 'Date'">
                        {{ prompt.prompt }}<br/>
                        <input type="text" ngbDatepicker/>
                    </div>

                    <div *ngIf="prompt.isActive && prompt.type == 'DateTime'">
                        {{ prompt.prompt }}<br/>
                        <div class="input-group-append">
                            <button class="input-group-text" id="{ {prompt.id }}" (click)="onSelectTime(prompt)">
                                <svg width="1em" height="1em" viewBox="0 0 16 16" class="bi bi-alarm" fill="currentColor"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path fill-rule="evenodd"
                                        d="M8 15A6 6 0 1 0 8 3a6 6 0 0 0 0 12zm0 1A7 7 0 1 0 8 2a7 7 0 0 0 0 14z" />
                                    <path fill-rule="evenodd"
                                        d="M8 4.5a.5.5 0 0 1 .5.5v4a.5.5 0 0 1-.053.224l-1.5 3a.5.5 0 1 1-.894-.448L7.5 8.882V5a.5.5 0 0 1 .5-.5z" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div *ngIf="prompt.isActive && prompt.type == 'User'">
                        {{ prompt.prompt }}
                    </div>

                </div>
            </div>
        </div>
    <div [ngStyle]="{'textAlign':'right'}">
        <button class="btn btn-secondary" type="submit" (click)="onCancel()">Cancel</button>
        &nbsp;
        <button class="btn btn-danger" type="submit" (click)="onSubmit()">Give</button>
    </div>
    </form>
</app-modal>
