
<div class="page-content-header">
    <div class="first">
        <a href="/Patients" class="go-back"></a>
        <div class="patient-bed_main">{{ patient.bedCode }}</div>
        <h1>{{ patient.fullName }}</h1>
    </div>
    <div class="second">
        <div class="patient-details">
            {{ patient.age }} {{ patient.ageUnit}}
        </div>
        <div [ngClass]="{'patient-details': 1, 'male': patient.gender === 'M', 'female': patient.gender === 'F'}"></div>
    </div>
</div>
