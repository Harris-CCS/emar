<ul>
    <li *ngFor="let item of displayCartItems">
        <span id="cart_{{item.id}}"></span>
        <span [ngClass]="{'unresolved allergy-dot': item.allergies?.length, 'placeholder-dot': item.allergies?.length === 0, 'allergy-loader': !item.allergies}"></span>
        <span [ngClass]="{'unresolved drug-dot' : item.drugs?.length, 'placeholder-dot': item.drugs?.length === 0, 'drug-loader': !item.drugs}"></span>
        <label for="cart_{{item.id}}" (click)="editCartItem(item)">{{item.name}} {{item.dose}} {{item.route}}</label>
        <button class="button delete" (click)="removeCartItem(item)"></button>
    </li>
</ul>
<span class="no-data" *ngIf="!displayCartItems.length">No New Orders</span>
<button 
    *ngIf="displayCartItems.length" 
    class="button-primary button-raised"
>Sign</button>
<button 
    *ngIf="displayCartItems.length" 
    class="button-secondary button-raised" 
    title="Delete All" 
    (click)="showDeleteAllCartOrderModal(patientId)"
>&#9851;</button>
