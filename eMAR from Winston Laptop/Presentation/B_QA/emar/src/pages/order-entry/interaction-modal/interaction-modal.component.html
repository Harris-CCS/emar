<app-modal modalId="interaction-modal" blocking="true" closebtn="true">
    <form [formGroup]="interactionForm" (ngSubmit)="onSubmit()">
        <span class="item">{{ getOrder().name }}</span>

        <span class="item" *ngIf="getTypeInteraction()=='allergies'" style="color:red">Long, very long Allergy name<br>Allergy name</span>
        <span class="item" *ngIf="getTypeInteraction()=='drugs'" style="color:red">Med name<br>Med name</span>

        <span class="subheader"><span>Rationale</span></span>
        <span class="item">
            <div class="form-check" formArrayName="rationale"
                *ngFor="let reason of reasons; let i=index;">
                <label *ngIf="reason.type == getTypeInteraction()" class="form-check-label">
                    <input class="form-check-input" type="checkbox"  id="{{ i }}"
                        [formControlName]="i">
                    {{ reason.label }}
                </label>
            </div>
        </span>

        <span class="subheader"><span>Other</span></span>
        <div class="form-group">
            <span class="item">
                <textarea id="otherReason" class="form-control" formControlName="otherReason"></textarea>
            </span>
        </div>
    
        <div class="dialog-footer">
            <div class="requirement" *ngIf="!interactionForm.valid">Give at least one reason</div>
            <button class="btn btn-danger" type="submit" [disabled]="!interactionForm.valid">Submit</button>
        </div>
    </form>
</app-modal>
